<svg width="100%" viewBox="0 0 780 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Battery voltage sense divider (Battery+ -> ESP32 GPIO35)</title>
<desc>100k ohm / 100k ohm resistor divider tapping the raw battery node directly, scaling 3.0-4.2V (single Li-ion cell range) down to 1.5-2.1V for the ESP32 ADC1 input on GPIO35. See spec.md section 10.</desc>
<rect x="40" y="40" width="170" height="65" rx="8" stroke-width="1" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:1px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="125.0" y="63.5" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central">Battery +</text>
<text x="125.0" y="85.5" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:central">raw node — same as</text>
<text x="125.0" y="97" text-anchor="middle" style="fill:rgb(24, 95, 165);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:9.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">TP4056 OUT+ / CR-SJ5530 IN+</text>
<rect x="560" y="40" width="180" height="65" rx="8" stroke-width="1" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:1px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="650.0" y="63.5" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central">ESP32 GPIO35</text>
<text x="650.0" y="85.5" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:central">ADC1, input-only</text>
<line x1="210" y1="72.5" x2="260.0" y2="72.5" stroke="#c0392b" stroke-width="2" style="fill:none;stroke:#c0392b;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<rect x="260.0" y="57.5" width="90" height="30" rx="2" style="fill:#ffffff;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="305.0" y="47.5" text-anchor="middle" style="fill:rgb(82, 81, 78);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">100kΩ (R1)</text>
<line x1="350.0" y1="72.5" x2="380" y2="72.5" stroke="#c0392b" stroke-width="2" style="fill:none;stroke:#c0392b;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<circle cx="380" cy="72.5" r="4.5" fill="#c9711f" style="font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="380" y1="72.5" x2="560" y2="72.5" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="470.0" y="58.5" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Vadc ≈ Vbat / 2</text>
<line x1="380" y1="72.5" x2="380" y2="127.5" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<rect x="365.0" y="127.5" width="30" height="70" rx="2" style="fill:#ffffff;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="407.0" y="162.5" text-anchor="start" dominant-baseline="central" style="fill:rgb(82, 81, 78);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:13px;font-weight:600;text-anchor:start;dominant-baseline:central">100kΩ (R2)</text>
<line x1="380" y1="197.5" x2="380" y2="217.5" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="380" y1="217.5" x2="380" y2="227.5" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="368.0" y1="227.5" x2="392.0" y2="227.5" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="372.0" y1="234.5" x2="388.0" y2="234.5" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="376.0" y1="241.5" x2="384.0" y2="241.5" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="477.0" y1="113.5" x2="503.0" y2="113.5" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="477.0" y1="121.5" x2="503.0" y2="121.5" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="513.0" y="117.5" text-anchor="start" dominant-baseline="central" style="fill:rgb(82, 81, 78);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:12px;font-weight:600;text-anchor:start;dominant-baseline:central">100nF (optional)</text>
<line x1="380" y1="92.5" x2="490" y2="92.5" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="490" y1="92.5" x2="490" y2="105.5" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="490" y1="129.5" x2="490" y2="217.5" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="490" y1="217.5" x2="380" y2="217.5" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="225" y="56.5" text-anchor="start" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:10.5px;font-weight:400;text-anchor:start;dominant-baseline:auto">Vbat (3.0–4.2V)</text>
<text x="390.0" y="305" text-anchor="middle" style="fill:rgb(12, 68, 124);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:13.5px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Vadc = Vbat × R2 / (R1 + R2) = Vbat / 2  →  1.50–2.10V for a 3.0–4.2V single Li-ion cell</text>
<text x="390.0" y="330" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">100kΩ/100kΩ, not smaller values: at Vbat=4.2V a 10kΩ/10kΩ divider would burn ~210µA continuously —</text>
<text x="390.0" y="346" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">100kΩ/100kΩ keeps it to ~21µA, always-on for the life of the battery (this divider isn't switched).</text>
<text x="390.0" y="371" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Real resistors won't land on exactly 2.000 — calibrate the ratio against a multimeter reading per board,</text>
<text x="390.0" y="387" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">same as this project already does for T-Call's onboard divider (config.h BATTERY_DIVIDER_RATIO).</text>
<text x="390.0" y="412" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">GPIO35 is ADC1 and input-only — matches this pin's existing role, no conflict. See spec.md §10.</text>
</svg>
