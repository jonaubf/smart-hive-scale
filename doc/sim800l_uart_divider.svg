<svg width="100%" viewBox="0 0 760 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ESP32 -> SIM800L RXD level-shift divider (TX leg)</title>
<desc>1k ohm series + 5.6k ohm shunt-to-GND voltage divider stepping ESP32's 3.3V UART TX (GPIO17) down to ~2.8V for SIM800L's RXD input, which is not 3.3V-tolerant. See spec.md section 10.</desc>
<rect x="40" y="40" width="160" height="70" rx="8" stroke-width="1" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:1px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="120.0" y="66.0" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central">ESP32 GPIO17</text>
<text x="120.0" y="88.0" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:central">TX2, 3.3V logic</text>
<rect x="560" y="40" width="160" height="70" rx="8" stroke-width="1" style="fill:rgb(230, 241, 251);stroke:rgb(24, 95, 165);stroke-width:1px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="640.0" y="66.0" text-anchor="middle" dominant-baseline="central" style="fill:rgb(12, 68, 124);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central">SIM800L RXD</text>
<text x="640.0" y="88.0" text-anchor="middle" dominant-baseline="central" style="fill:rgb(24, 95, 165);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:central">pin 31, 2.8V max</text>
<line x1="200" y1="75.0" x2="255.0" y2="75.0" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<rect x="255.0" y="60.0" width="90" height="30" rx="2" style="fill:#ffffff;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="300.0" y="50.0" text-anchor="middle" style="fill:rgb(82, 81, 78);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:auto">1 kΩ</text>
<line x1="345.0" y1="75.0" x2="380" y2="75.0" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<circle cx="380" cy="75.0" r="4.5" fill="#c9711f" style="font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="380" y1="75.0" x2="560" y2="75.0" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="380" y1="75.0" x2="380" y2="130.0" stroke="#c9711f" stroke-width="2" style="fill:none;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<rect x="365.0" y="130.0" width="30" height="70" rx="2" style="fill:#ffffff;stroke:#c9711f;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="407.0" y="165.0" text-anchor="start" dominant-baseline="central" style="fill:rgb(82, 81, 78);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:13px;font-weight:600;text-anchor:start;dominant-baseline:central">5.6 kΩ</text>
<line x1="380" y1="200.0" x2="380" y2="220.0" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="380" y1="220.0" x2="380" y2="230.0" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="368.0" y1="230.0" x2="392.0" y2="230.0" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="372.0" y1="237.0" x2="388.0" y2="237.0" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<line x1="376.0" y1="244.0" x2="384.0" y2="244.0" stroke="#3a3a3a" stroke-width="2" style="fill:none;stroke:#3a3a3a;stroke-width:2px;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;"/>
<text x="215" y="59.0" text-anchor="start" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">3.3V high</text>
<text x="390" y="59.0" text-anchor="start" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">node ≈ 2.8V high</text>
<text x="380.0" y="300" text-anchor="middle" style="fill:rgb(12, 68, 124);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:auto">Vout = 3.3V × 5.6kΩ / (1kΩ + 5.6kΩ) ≈ 2.8V</text>
<text x="380.0" y="325" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Only this leg (ESP32 → SIM800L RXD) needs the divider — SIM800L's TXD → ESP32 RX</text>
<text x="380.0" y="341" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">only needs a series 1 kΩ (protection only); 2.8V already reads as logic-high on ESP32's 3.3V input.</text>
<text x="380.0" y="366" text-anchor="middle" style="fill:rgb(120,118,112);stroke:none;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;font-size:10.5px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Reference: SIM800L datasheet Figure 20 "Resistor matching circuit" — see spec.md §10</text>
</svg>
