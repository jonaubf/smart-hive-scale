    - name: Hive 01 Boost keep-on
      unique_id: beekpr_hive_01_boost_keep_on
      default_entity_id: binary_sensor.hive_01_boost_keep_on
      state_topic: beekpr/hive-01/state
      value_template: "{{ value_json.boost_keep_on }}"
      payload_on: "true"
      payload_off: "false"
      icon: mdi:power-plug-battery
      expire_after: 45000
