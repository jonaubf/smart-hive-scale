# Beekpr hive MQTT entities — one Home Assistant device per hive.
#
# Install:
#   1. Copy this file to your HA config folder, e.g. config/packages/beekpr_hive_01.yaml
#   2. Enable packages in configuration.yaml (if not already):
#        homeassistant:
#          packages: !include_dir_named packages/
#   3. Replace every "hive-01" / "hive_01" below if your DEVICE_ID differs.
#   4. Restart Home Assistant.
#
# Prerequisites: MQTT integration connected to local Mosquitto on 127.0.0.1:1883.
# The hive must publish JSON to beekpr/hive-01/state (see doc/user-guide.md).
#
# Hardware rework in progress: this file matches today's TTGO T-Call payload (single load cell,
# weight_kg/stable_kg only). The discrete ESP32-WROOM-32 + 4-corner-load-cell rework (spec.md) will
# add corner1_kg..corner4_kg fields — see the commented-out block below the "Weight (stable)" sensor
# for ready-to-enable entities once firmware actually publishes them. Uncommenting them now would
# just leave 4 permanently-unavailable entities, since the fields don't exist in the payload yet.

mqtt:
  sensor:
    - name: Hive 01 Weight
      unique_id: beekpr_hive_01_weight_kg
      default_entity_id: sensor.hive_01_weight
      state_topic: beekpr/hive-01/state
      value_template: "{{ value_json.weight_kg }}"
      unit_of_measurement: kg
      state_class: measurement
      device_class: weight
      icon: mdi:scale-bathroom
      expire_after: 45000
      availability:
        - topic: beekpr/hive-01/availability
          payload_available: online
          payload_not_available: offline
      device: &beekpr_hive_01_device
        identifiers:
          - beekpr_hive_01
        name: Hive 01
        manufacturer: Beekpr
        model: Hive Weight Monitor
        configuration_url: http://beekpr-hive-01.local

    - name: Hive 01 Report time
      unique_id: beekpr_hive_01_report_time
      default_entity_id: sensor.hive_01_report_time
      state_topic: beekpr/hive-01/state
      value_template: >-
        {{ value_json.report_time if value_json.report_time is not none else 'unknown' }}
      device_class: timestamp
      icon: mdi:clock-check-outline
      expire_after: 45000
      availability:
        - topic: beekpr/hive-01/availability
          payload_available: online
          payload_not_available: offline
      device: *beekpr_hive_01_device

    - name: Hive 01 Weight (stable)
      unique_id: beekpr_hive_01_stable_kg
      default_entity_id: sensor.hive_01_weight_stable
      state_topic: beekpr/hive-01/state
      value_template: "{{ value_json.stable_kg }}"
      unit_of_measurement: kg
      state_class: measurement
      device_class: weight
      icon: mdi:scale
      expire_after: 45000
      availability:
        - topic: beekpr/hive-01/availability
          payload_available: online
          payload_not_available: offline
      device: *beekpr_hive_01_device

